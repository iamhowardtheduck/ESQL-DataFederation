name: hr--enrich-logs-by-ip
description: Enrich matching logs-* documents with HR Department, Sub-Department, and Start-Date using IP matches from hr_directory.
enabled: true

tags:
  - enrichment
  - hr
  - esql

version: "1"

inputs:
  - name: logs_query
    type: string
    required: true
    description: >
      A document-level ES|QL query targeting logs-* supplied by the user
      or investigation context. Do not invent a logs-* query.

triggers:
  - type: manual

settings:
  timeout: "10m"

steps:

  # ------------------------------------------------------------
  # Normalize the ES|QL query supplied by the user/context
  # ------------------------------------------------------------

  - name: remove_trailing_semicolon
    type: data.regexReplace
    source: "${{ inputs.logs_query }}"
    with:
      pattern: ';\s*$'
      replacement: ''
      flags: "i"

  # If the FROM command has no METADATA clause, add one.
  - name: ensure_metadata_clause
    type: data.regexReplace
    source: "${{ steps.remove_trailing_semicolon.output }}"
    with:
      pattern: '^(\s*FROM\s+logs-\*)(?!\s+METADATA\b)'
      replacement: '$1 METADATA _index, _id'
      flags: "im"

  # If METADATA exists but does not contain _index, add it.
  - name: ensure_index_metadata
    type: data.regexReplace
    source: "${{ steps.ensure_metadata_clause.output }}"
    with:
      pattern: '^(\s*FROM\s+logs-\*\s+METADATA\s+)(?![^|\r\n]*\b_index\b)([^|\r\n]+)'
      replacement: '$1_index, $2'
      flags: "im"

  # If METADATA exists but does not contain _id, add it.
  - name: ensure_id_metadata
    type: data.regexReplace
    source: "${{ steps.ensure_index_metadata.output }}"
    with:
      pattern: '^(\s*FROM\s+logs-\*\s+METADATA\s+)(?![^|\r\n]*\b_id\b)([^|\r\n]+)'
      replacement: '$1_id, $2'
      flags: "im"

  # ------------------------------------------------------------
  # Execute the user/context supplied logs-* query.
  #
  # KEEP gives us a predictable ES|QL result:
  #
  #   [0] _index
  #   [1] _id
  #   [2] client.ip
  #   [3] source.ip
  #   [4] host.ip
  # ------------------------------------------------------------

  - name: query_logs
    type: elasticsearch.esql.query
    with:
      query: |
        {{ steps.ensure_id_metadata.output }}
        | KEEP _index, _id, client.ip, source.ip, host.ip

  # ------------------------------------------------------------
  # Process every document returned by the provided query
  # ------------------------------------------------------------

  - name: enrich_each_log
    type: foreach
    foreach: "${{ steps.query_logs.output.values }}"

    max-iterations:
      limit: 2000
      on-limit: fail

    steps:

      # Save the current log document information.
      - name: capture_log_document
        type: data.set
        with:
          log_index: "{{ foreach.item[0] }}"
          log_id: "{{ foreach.item[1] }}"
          client_ip: "{{ foreach.item[2] | default: '' }}"
          source_ip: "{{ foreach.item[3] | default: '' }}"
          host_ip: "{{ foreach.item[4] | default: '' }}"

      # --------------------------------------------------------
      # Query HR directory.
      #
      # Convert IP_Address from string/keyword -> ip.
      #
      # Match priority:
      #   1. client.ip
      #   2. source.ip
      #   3. host.ip
      #
      # The priority only matters if a single log event happens
      # to contain multiple IPs belonging to different HR rows.
      # --------------------------------------------------------

      - name: lookup_hr
        type: elasticsearch.esql.query
        with:
          query: |
            FROM hr_directory
            | EVAL hr_ip = TO_IP(IP_Address)
            | EVAL match_rank = CASE(
                hr_ip == TO_IP("{{ variables.client_ip }}"), 1,
                hr_ip == TO_IP("{{ variables.source_ip }}"), 2,
                hr_ip == TO_IP("{{ variables.host_ip }}"), 3,
                99
              )
            | WHERE match_rank < 99
            | SORT match_rank ASC
            | KEEP Department, `Sub-Department`, `Start_Date`, `First_Name`, `Last_Name`
            | LIMIT 1

      # --------------------------------------------------------
      # If lookup_hr returns no rows, this foreach performs
      # zero iterations and the original document is untouched.
      #
      # If an HR match exists, update that exact logs-* document.
      # --------------------------------------------------------

      - name: update_from_hr_match
        type: foreach
        foreach: "${{ steps.lookup_hr.output.values }}"

        max-iterations:
          limit: 1
          on-limit: fail

        steps:

          - name: enrich_log_document
            type: elasticsearch.update
            with:
              index: "{{ variables.log_index }}"
              id: "{{ variables.log_id }}"
              doc:
                "enriched.Department": "{{ foreach.item[0] }}"
                "enriched.Sub-Department": "{{ foreach.item[1] }}"
                "enriched.StartDate": "{{ foreach.item[2] }}"
                "enriched.First_Name": "{{ foreach.item[3] }}"
                "enriched.Last_Name": "{{ foreach.item[4] }}"
